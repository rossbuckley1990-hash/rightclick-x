# Cloudflare Workers deployment: `npx wrangler deploy`
name = "rightclick-x"
main = "src/entry/edge.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
RCX_NAME = "rightclick-x-edge"
# RCX_SOURCES = "https://countries.trevorblades.com/,https://petstore3.swagger.io/api/v3/openapi.json"

# Required: `npx wrangler secret put RCX_TOKEN`
# Optional: `npx wrangler secret put RCX_AUTH`  (JSON: {"https://api.x.com": "Bearer ..."})

# This Worker does not persist state. Workers KV is eventually consistent, allows one write per
# second per key and has no atomic operations, so its many isolates cannot share it as one writer.
# For persistent state deploy the Durable Object entry (src/entry/durable.ts; see deploy/cloud.ts),
# which has one writer per object. RCX_STATE may hold a state to load read-only:
# [[kv_namespaces]]
# binding = "RCX_STATE"
# id = "<kv namespace id>"

# Any other KV namespace or Workers AI binding becomes graph capabilities automatically:
# [ai]
# binding = "AI"
