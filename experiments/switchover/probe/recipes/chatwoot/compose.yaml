# Genuine open-source customer-support platform: Chatwoot (MIT, Ruby on Rails).
# A support-case product with a REST API, included as a candidate to replace
# Zammad in the switchover test.

services:
  db:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${PROBE_DB_PASSWORD:-probe-db-pw}
      POSTGRES_DB: chatwoot_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped

  base: &base
    image: docker.io/chatwoot/chatwoot:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &env
      DATABASE_URL: postgres://chatwoot:${PROBE_DB_PASSWORD:-probe-db-pw}@db:5432/chatwoot_production
      REDIS_URL: redis://redis:6379
      RAILS_ENV: production
      NODE_ENV: production
      FRONTEND_URL: http://127.0.0.1:8006
      SECRET_KEY_BASE: ${PROBE_SECRET_KEY:-probe-only-not-a-production-secret}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${PROBE_AR_PRIMARY:-probe-only-primary-key-32-chars!!}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${PROBE_AR_DETERMINISTIC:-probe-only-deterministic-key-32c}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${PROBE_AR_SALT:-probe-only-salt-32-characters!!!}
      ENABLE_DB_AUTOMIGRATION: "true"

  web:
    <<: *base
    ports:
      - "8006:3000"
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
