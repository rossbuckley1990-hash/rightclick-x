# Genuine open-source forge / issue tracker: Gitea (MIT, Go).
# Serves a real OpenAPI contract, and its issues, organisations and attachments
# can carry a genuine support-case and evidence workload.

services:
  gitea:
    image: docker.io/gitea/gitea:1.24
    ports:
      - "8010:3000"
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://127.0.0.1:8010/
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__api__ENABLE_SWAGGER: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${PROBE_SECRET_KEY:-probe-only-not-a-production-secret}
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
    volumes:
      - gitea_data:/data

volumes:
  gitea_data:
