# Controlled, disposable test service for Open-World Experiment 4 (free tier).
# Deploy:   npx wrangler deploy -c experiments/open-world/service/wrangler.toml
# Secret:   npx wrangler secret put ADMIN_TOKEN -c experiments/open-world/service/wrangler.toml
name = "rcx-ow-service"
main = "worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "SERVICE"
class_name = "ContractHolder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContractHolder"]
