<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="320" viewBox="0 0 1470 320" role="img" aria-labelledby="title desc">
<title id="title">RightClick X</title>
<desc id="desc">Connect anything. Empower any agent. A glowing click cursor inside a violet-to-blue ring beside the RightClick X wordmark.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c22"/><stop offset=".55" stop-color="#0b112b"/><stop offset="1" stop-color="#090a20"/></linearGradient>
<radialGradient id="glowL"><stop stop-color="#44249b" stop-opacity=".44"/><stop offset="1" stop-color="#44249b" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR"><stop stop-color="#2446ab" stop-opacity=".24"/><stop offset="1" stop-color="#2446ab" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c34bf6"/><stop offset=".42" stop-color="#6268ff"/><stop offset="1" stop-color="#20c7fa"/></linearGradient>
<linearGradient id="xFill" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#f248e8"/><stop offset=".49" stop-color="#8f69fe"/><stop offset="1" stop-color="#25d0f8"/></linearGradient>
<linearGradient id="pointer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#eef1ff"/><stop offset="1" stop-color="#82c5ff"/></linearGradient>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#5669bf" stroke-opacity=".14" stroke-width=".7"/></pattern>
<filter id="neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1470" height="320" rx="16" fill="url(#bg)"/>
<rect width="460" height="320" fill="url(#grid)"/>
<ellipse cx="200" cy="150" rx="310" ry="220" fill="url(#glowL)"/>
<ellipse cx="1200" cy="80" rx="350" ry="220" fill="url(#glowR)"/>
<path d="M130 183 A112 112 0 1 0 215 53" fill="none" stroke="#8859fe" stroke-width="21" stroke-opacity=".22" filter="url(#soft)"/>
<path d="M130 183 A112 112 0 1 0 215 53" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" filter="url(#neon)"/>
<g stroke="#bf87ff" stroke-width="10" stroke-linecap="round" filter="url(#neon)"><path d="M216 28V7"/><path d="M167 48l-20-22"/><path d="M142 91h-26"/></g>
<path d="M187 83Q182 74 196 79L303 131Q315 136 301 146L260 167L288 210Q293 217 285 222L270 232Q263 237 257 230L227 190L199 221Q191 230 188 215Z" fill="url(#pointer)" stroke="#d9ceff" stroke-width="6" stroke-linejoin="round" filter="url(#neon)"/>
<text x="404" y="192" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="113" font-weight="800" letter-spacing="-7">RightClick</text>
<text x="930" y="193" fill="url(#xFill)" font-family="Arial, Helvetica, sans-serif" font-size="158" font-weight="900" letter-spacing="-8">X</text>
<text x="413" y="254" fill="#d6defb" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="7.2">CONNECT ANYTHING. EMPOWER ANY AGENT.</text>
<path d="M404 277H1192" stroke="url(#ring)" stroke-width="2" opacity=".35"/>
<g fill="#c6b0ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="italic" font-weight="700" letter-spacing=".3"><text x="1290" y="122" transform="rotate(-9 1290 122)">APIs</text><text x="1282" y="151" transform="rotate(-9 1282 151)">SHOULD</text><text x="1278" y="180" transform="rotate(-9 1278 180)">JUST WORK.</text></g>
<path d="M1295 196l121-19" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
</svg>
