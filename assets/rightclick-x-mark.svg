<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">RightClick X icon</title><desc id="desc">A bright click cursor in a violet-to-cyan ring on a midnight background.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b102b"/><stop offset="1" stop-color="#111338"/></linearGradient>
<linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c548ef"/><stop offset=".47" stop-color="#7565ff"/><stop offset="1" stop-color="#2dc8f5"/></linearGradient>
<linearGradient id="pointer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9bcfff"/></linearGradient>
<filter id="neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="320" height="320" rx="72" fill="url(#bg)"/>
<circle cx="160" cy="160" r="116" fill="none" stroke="#333263" stroke-width="3"/>
<path d="M74 178A112 112 0 1 0 164 48" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" filter="url(#neon)"/>
<g stroke="#bb7dff" stroke-width="9" stroke-linecap="round" filter="url(#neon)"><path d="M161 32V15"/><path d="M105 55L89 39"/><path d="M78 103H57"/></g>
<path d="M135 92Q131 82 145 89L242 133Q255 139 240 148L204 167L230 208Q235 216 227 220L211 230Q204 234 199 226L171 188L147 217Q140 225 135 210Z" fill="url(#pointer)" stroke="#d7cbff" stroke-width="5" stroke-linejoin="round" filter="url(#neon)"/>
</svg>
