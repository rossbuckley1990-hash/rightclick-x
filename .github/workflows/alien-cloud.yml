# Disposable Linux cloud runtime for RightClick-X experiments.
# Triggered manually. Runs RCX serve behind a cloudflared tunnel.
# Exposes authenticated Streamable HTTP MCP endpoint.

name: alien-cloud

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'Minutes to keep the runtime alive'
        required: false
        default: '45'
      rcx_token:
        description: 'Auth token for RCX (leave empty to autogenerate)'
        required: false
        default: 'rcx-alien-cloud-auth-20261019'

jobs:
  cloud-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Configure Token
        id: auth
        run: |
          TOKEN="${{ github.event.inputs.rcx_token }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="rcx-$(openssl rand -hex 16)"
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "RCX_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Start RightClick-X
        run: |
          export RCX_NAME="rcx-alien-cloud"
          node bin/rcx.ts serve --host 127.0.0.1 --port 8787 &
          RCX_PID=$!
          echo "rcx_pid=$RCX_PID" >> "$GITHUB_ENV"

          # Wait for server
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null 2>&1; then
              echo "RightClick-X is ready (PID $RCX_PID)"
              break
            fi
            sleep 1
          done

      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 > /tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          echo "tunnel_pid=$TUNNEL_PID" >> "$GITHUB_ENV"

          # Wait for tunnel URL
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "Tunnel established: $TUNNEL_URL"
              echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
              echo "tunnel_url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Tunnel failed"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "  REMOTE RIGHTCLICK-X LINUX RUNTIME"
          echo "========================================"
          echo "URL: $TUNNEL_URL"
          echo "TOKEN: ${{ steps.auth.outputs.token }}"
          echo "MCP: ${TUNNEL_URL}/mcp"
          echo "OS: $(uname -srm)"
          echo "HOST: $(hostname)"
          echo "NODE: $(node -v)"
          echo "========================================"

          # Also write to Step Summary
          echo "## Remote RightClick-X Linux Cloud Runtime" >> $GITHUB_STEP_SUMMARY
          echo "- **Tunnel URL:** \`$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Endpoint:** \`${TUNNEL_URL}/mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** \`$(uname -srm)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node:** \`$(node -v)\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify local execution & learn Wikipedia
        run: |
          # 1. Verify runtime
          curl -sf -X POST http://127.0.0.1:8787/api/runtime \
            -H "Authorization: Bearer $RCX_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/runtime.json
          cat /tmp/runtime.json | jq .

          # 2. Learn Wikipedia API
          curl -sf -X POST http://127.0.0.1:8787/api/learn \
            -H "Authorization: Bearer $RCX_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sources": ["https://en.wikipedia.org/api/rest_v1/?spec"]}' > /tmp/learn.json

          # 3. Graph search for getPageSummary
          WIKI_CAP=$(curl -sf -X POST http://127.0.0.1:8787/api/graph \
            -H "Authorization: Bearer $RCX_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"op": "search", "query": "summary"}' | jq -r '.[] | select(.id | contains("summary")) | .id' | head -1)
          echo "Target capability: $WIKI_CAP"

          # 4. Execute operation
          if [ -n "$WIKI_CAP" ]; then
            curl -sf -X POST http://127.0.0.1:8787/api/run \
              -H "Authorization: Bearer $RCX_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"id\": \"$WIKI_CAP\", \"args\": {\"title\": \"Linux\"}}" > /tmp/run.json
            echo "Execution result:"
            cat /tmp/run.json | jq '{status, receiptId: .receipt.id, hasOutput: (.output != null)}'
          fi

      - name: Keep alive
        run: |
          TIMEOUT=${{ github.event.inputs.timeout_minutes || '45' }}
          echo "Keeping runtime alive for ${TIMEOUT} minutes..."
          SECONDS_LEFT=$((TIMEOUT * 60))
          while [ $SECONDS_LEFT -gt 0 ]; do
            HEALTH=$(curl -sf http://127.0.0.1:8787/health 2>/dev/null || echo '{"ok": false}')
            MINS=$((SECONDS_LEFT / 60))
            echo "[$(date -u +%H:%M:%S)] ${MINS}m remaining — health: $HEALTH"
            sleep 60
            SECONDS_LEFT=$((SECONDS_LEFT - 60))
          done
          echo "Timeout reached. Shutting down."
