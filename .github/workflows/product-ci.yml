name: product-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node experiments/sse-discovery/acceptance.mjs . /tmp/rcx-discovery-acceptance.json
      - run: node proof/run.ts 20261018
      - run: node experiments/open-world/negative-controls.ts
      - run: npm run build
      - name: Check the built CLI and browser entry
        run: |
          node dist/rcx.mjs version
          node --input-type=module -e "await import('./dist/edge.js')"
